spring:
  application:
    name: taxi-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taxi}
    username: ${SPRING_DATASOURCE_USERNAME:taxi}
    password: ${SPRING_DATASOURCE_PASSWORD:taxi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

taxi:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-min}
    expiration-minutes: 60
  dispatch:
    search-radius-km: 5.0
    offer-timeout-seconds: 15
    offer-sweep-interval-ms: 2000
    scheduled-sweep-interval-ms: 15000
  pricing:
    zone-id: Asia/Ashgabat
    # Fallback defaults only — every one of these is admin-editable at runtime via the
    # `pricing.*` platform_settings keys (see PricingService/PricingSettingsPage).
    base-fare: 10
    per-km: 3.2
    min-fare: 15
    peak-multiplier: 1.3
    peak-morning-start: 7
    peak-morning-end: 9
    peak-evening-start: 18
    peak-evening-end: 21
    night-multiplier: 1.2
    night-start: 23
    night-end: 5
    cancellation-grace-seconds: 180
    cancellation-fee: 5
  push:
    # Generate with `npx web-push generate-vapid-keys`. Left blank, Web Push is a no-op
    # (WebPushSender logs a warning) — the WebSocket-based live updates still work either way.
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:support@taksigo.local}
  otp:
    max-per-window: 3
    window-minutes: 10
    expiry-minutes: 5
    # Flips to true once a real SMS provider replaces LoggingOtpAdapter — surfaced honestly
    # on the admin System Status panel rather than always claiming "Healthy".
    sms-gateway-configured: ${SMS_GATEWAY_CONFIGURED:false}
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@taxi.local}
    password: ${ADMIN_PASSWORD:AdminSecret123}
    full-name: ${ADMIN_FULL_NAME:Platform Admin}
    # Separate from JWT_SECRET so rotating one credential does not silently rotate the other.
    two-factor-encryption-key: ${TOTP_ENCRYPTION_KEY:local-dev-totp-encryption-key-change-me-32bytes}
    two-factor-issuer: ${TOTP_ISSUER:Taxi Platform Admin}
  cors:
    # 5174/5175 = Taksi Go website (also serves the admin panel at /admin and driver cabinet at /driver)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5175}
  storage:
    # Local-disk root for driver verification documents (license/vehicle photos).
    root: ${STORAGE_ROOT:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
